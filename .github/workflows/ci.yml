name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: greentrack/package-lock.json

      - name: Install dependencies
        working-directory: greentrack
        run: npm ci

      - name: Compile contracts
        working-directory: greentrack
        run: npm run compile

      - name: Run tests
        working-directory: greentrack
        run: npm test
        env:
          REPORT_GAS: true

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: greentrack/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: greentrack/frontend
        run: npm ci

      - name: Lint
        working-directory: greentrack/frontend
        run: npm run lint

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: greentrack/frontend/package-lock.json

      - name: Install root dependencies (for artifacts)
        working-directory: greentrack
        run: npm ci

      - name: Compile contracts (to generate artifacts)
        working-directory: greentrack
        run: npm run compile

      - name: Install frontend dependencies
        working-directory: greentrack/frontend
        run: npm ci

      - name: Build
        working-directory: greentrack/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_CONTRACT_LEDGER: ${{ secrets.NEXT_PUBLIC_CONTRACT_LEDGER }}
          NEXT_PUBLIC_CONTRACT_SEAL: ${{ secrets.NEXT_PUBLIC_CONTRACT_SEAL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_PINATA_JWT: ${{ secrets.NEXT_PUBLIC_PINATA_JWT }}
